<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roadmap Q4 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Supabase (cliente oficial) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  /* ==== CONFIGURACIÓN: pega aquí los datos de tu proyecto Supabase ==== */
  window.ROADMAP_CONFIG = {
    SUPABASE_URL: "https://TU-PROYECTO.supabase.co",
    SUPABASE_ANON_KEY: "TU_ANON_KEY",
    ROADMAP_ID: "principal"   // cambia esto si quieres tener varios roadmaps separados
  };
</script>
<style>
:root,:root[data-theme]{
  color-scheme:light;
  --bg:#F3ECE0;--surface:#FBF7F0;--ink:#2E2821;--muted:#7D7264;--line:#E4D9C7;
  --weekend:#EEE5D6;--off:#DCCDB6;--today:#2F6F9F;--field:#F6F0E6;
  --dw:26px;--label:180px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:#F3ECE0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--today);outline-offset:2px}
.page{max-width:1400px;margin:0 auto;padding:28px 20px 80px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-weight:700;font-size:clamp(30px,5vw,48px);line-height:1;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);margin:8px 0 0;max-width:62ch}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.zoom{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.zoom button{border:0;background:none;padding:7px 11px;font-weight:600}
.zoom button+button{border-left:1px solid var(--line)}
.status{font-size:13px;color:var(--muted);min-width:80px;text-align:right}

/* Timeline */
.tl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto;position:relative}
.tl{position:relative;width:max-content;min-width:100%}
.tl-wrap{scrollbar-color:#DCCDB6 #F6F0E6;scrollbar-width:thin}
.tl-wrap::-webkit-scrollbar{height:10px}
.tl-wrap::-webkit-scrollbar-track{background:#F6F0E6;border-radius:0 0 14px 14px}
.tl-wrap::-webkit-scrollbar-thumb{background:#DCCDB6;border-radius:10px;border:2px solid #F6F0E6}
.tl-wrap::-webkit-scrollbar-thumb:hover{background:#CBB99E}
.row{display:flex;position:relative}
.lab{position:sticky;left:0;z-index:3;width:var(--label);flex:0 0 var(--label);background:var(--surface);border-right:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:8px}
.lane{position:relative;flex:0 0 auto}
.months .lab,.days .lab{padding:6px 12px;font-size:12px;color:var(--muted)}
.months{border-bottom:1px solid var(--line)}
.month{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 6px 0 8px;overflow:hidden;white-space:nowrap;font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:700;font-size:15px;border-left:1px solid var(--line)}
.month.out{color:var(--muted);font-weight:500}
.days{border-bottom:1px solid var(--line)}
.day{position:absolute;top:0;bottom:0;border:0;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:1.15;color:var(--muted)}
.day b{font-weight:600;color:var(--ink);font-size:12px}
.day.we b{color:var(--muted);font-weight:400}
.day.off b{text-decoration:line-through}
.day.today b{color:var(--today)}
.day:hover{background:color-mix(in srgb,var(--today) 8%,transparent)}
.cols{position:absolute;top:0;bottom:0;left:var(--label);pointer-events:none;z-index:0}
.col{position:absolute;top:0;bottom:0}
.col.we{background:var(--weekend)}
.col.off{background:repeating-linear-gradient(135deg,var(--off) 0 3px,transparent 3px 7px)}
.col.mstart{border-left:1px solid var(--line)}
.col.today{border-left:2px solid var(--today)}
.prow{border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .lab{font-weight:600;font-size:14px}
.prow .lab small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.bar{position:absolute;height:28px;border-radius:6px;border:0;padding:0 8px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;z-index:1;text-align:left}
.bar span{overflow:hidden;text-overflow:ellipsis}
.bar em{font-style:normal;font-weight:500;opacity:.8;margin-left:auto}
.bar{background:color-mix(in srgb,var(--bc) 22%,#FBF7F0);color:var(--ink);border:1px solid color-mix(in srgb,var(--bc) 45%,#FBF7F0);border-left:4px solid var(--bc)}
.bar .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--bc);opacity:.8}
.bar.clip-r{border-top-right-radius:0;border-bottom-right-radius:0}
.bar.clip-l{border-top-left-radius:0;border-bottom-left-radius:0}
.bar:hover{background:color-mix(in srgb,var(--bc) 32%,#FBF7F0)}
.empty-tl{padding:28px;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 2px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}

/* Panel */
h2{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.01em;margin:40px 0 14px}
.product{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.phead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-left:6px solid var(--pc);flex-wrap:wrap}
.phead .caret{border:0;background:none;padding:2px 4px;font-size:14px;color:var(--muted);transition:transform .15s}
.product.closed .caret{transform:rotate(-90deg)}
.pname{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:700;font-size:19px;border:1px solid transparent;background:none;border-radius:6px;padding:2px 6px;min-width:0;flex:1 1 180px}
.pname:hover,.pname:focus{border-color:var(--line);background:var(--field)}
.color{width:30px;height:30px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--surface)}
.pmeta{color:var(--muted);font-size:13px}
.sprints{border-top:1px solid var(--line)}
.product.closed .sprints{display:none}
.sprint{border-bottom:1px solid var(--line)}
.sprint:last-child{border-bottom:0}
.sprint.flash{animation:flash 1.2s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--pc) 22%,transparent)}to{background:transparent}}
.srow{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(170px,1.3fr) auto minmax(120px,1fr) minmax(150px,1fr) auto auto;gap:10px;align-items:center;padding:10px 14px}
.field{border:1px solid var(--line);background:var(--field);border-radius:7px;padding:6px 9px;min-width:0;width:100%}
.start{display:flex;gap:6px;align-items:center}
.start select{flex:0 0 auto;width:auto}
.start .gap{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.start .gap input{width:58px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;background:var(--field);overflow:hidden}
.step button{border:0;background:none;width:30px;height:32px;font-size:16px;font-weight:600}
.step input{width:40px;border:0;background:none;text-align:center;font-weight:600;padding:0;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.step span{font-size:12px;color:var(--muted);padding-right:8px}
.computed{font-size:14px;font-weight:600}
.computed small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.computed.warn small{color:#C2410C}
.link{display:flex;align-items:center;gap:6px;min-width:0}
.link a{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--today);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--surface)}
.link a:hover{border-color:var(--today)}
.link a[hidden]{display:none}
.ttoggle{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.ttoggle[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.icon{border:0;background:none;color:var(--muted);padding:6px;border-radius:6px;font-size:15px}
.icon:hover{color:#C2410C;background:var(--field)}
.tasks{padding:4px 14px 14px 30px;display:none}
.tasks.open{display:block}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
.task select{width:112px}
.task.done .field.txt{text-decoration:line-through;color:var(--muted)}
.addtask{display:flex;gap:8px;margin-top:8px}
.muted{color:var(--muted);font-size:13px;margin:6px 0}
.addsprint{padding:10px 14px}
.pactions{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;display:none;gap:14px;align-items:center;font-size:14px;z-index:20}
.toast.show{display:flex}
.toast button{background:none;border:1px solid currentColor;border-radius:6px;padding:3px 10px;font-weight:600}

@media (max-width:860px){
  :root{--label:120px}
  .srow{grid-template-columns:1fr 1fr;}
  .srow .start{grid-column:1 / -1}
  .tasks{padding-left:14px}
}
@media (prefers-reduced-motion:reduce){.sprint.flash{animation:none}.caret{transition:none}}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <h1>Roadmap Q4 2026</h1>
      <p class="sub">Octubre - Noviembre - Diciembre</p>
    </div>
    <div class="tools">
      <span class="status" id="status"></span>
      <div class="zoom" role="group" aria-label="Zoom del calendario">
        <button id="zout" aria-label="Alejar">−</button>
        <button id="zin" aria-label="Acercar">+</button>
      </div>
      <button class="btn primary" id="addProduct">+ Producto</button>
    </div>
  </header>

  <div class="tl-wrap" id="tlwrap"><div class="tl" id="tl"></div></div>
  <div class="legend">
    <span><i style="background:var(--weekend)"></i>Fin de semana</span>
    <span><i style="background:repeating-linear-gradient(135deg,var(--off) 0 3px,transparent 3px 7px)"></i>Día libre (no cuenta como hábil)</span>
    <span><i style="background:none;border:0;border-left:2px solid var(--today);border-radius:0"></i>Hoy</span>
  </div>

  <h2>Productos, sprints y tareas</h2>
  <div id="panel"></div>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="undo">Deshacer</button></div>

<script>
(function(){
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIA=['D','L','M','M','J','V','S'];
const PALETTE=['#1FA37A','#F08A24','#F5B942','#7A5AF8','#E0457B','#2F8FDB','#8A9A2B','#D1553C'];
const TL_START=new Date(2026,8,28,12), TL_END=new Date(2026,11,31,12);
const Q_END_ISO='2026-12-31';
const KEY='roadmap-q4-2026-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=d=>d.getDate()+' '+MES[d.getMonth()];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=[];for(let d=new Date(TL_START);d<=TL_END;d=addD(d,1))DAYS.push(d);
const N=DAYS.length;
const idxOf=d=>Math.round((d-TL_START)/864e5);
const TODAY=(()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate(),12)})();

function seed(){
  const s=(name,start,days,extra)=>Object.assign({id:uid(),name,mode:'date',start,gap:0,days,tasks:[]},extra||{});
  return {v:1,offDays:['2026-10-12','2026-12-24','2026-12-25','2026-12-31'],products:[
    {id:uid(),name:'Vida Fit',color:'#1FA37A',closed:false,sprints:[s('Sprint 1','2026-09-28',10)]},
    {id:uid(),name:'Mandarina no formal',color:'#F5B942',closed:false,sprints:[s('Sprint 1','2026-09-29',10)]},
    {id:uid(),name:'Mandarina legal',color:'#F08A24',closed:false,sprints:[
      s('Sprint 1','2026-10-19',10),
      s('Sprint 2','2026-10-19',10,{mode:'after',gap:10}),
      s('Sprint 3','2026-10-19',10,{mode:'after',gap:10})]},
    {id:uid(),name:'Petsito',color:'#7A5AF8',closed:false,sprints:[s('Sprint 1','2026-09-28',5)]}
  ]};
}
let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state||!Array.isArray(state.products))state=seed();
const openTasks=new Set();

/* ---------- scheduling ---------- */
let OFF=new Set();
const isWork=d=>{const w=d.getDay();return w!==0&&w!==6&&!OFF.has(iso(d))};
const nextWork=d=>{let x=new Date(d),g=0;while(!isWork(x)&&g++<400)x=addD(x,1);return x};
function schedule(p){
  OFF=new Set(state.offDays);
  let prevEnd=null;
  return p.sprints.map(sp=>{
    let st;
    if(sp.mode==='after'&&prevEnd){
      let d=addD(prevEnd,1),g=Math.max(0,sp.gap|0),guard=0;
      while(g>0&&guard++<400){if(isWork(d))g--;d=addD(d,1)}
      st=nextWork(d);
    }else st=nextWork(parse(sp.start||'2026-09-28'));
    let end=st,n=1,days=Math.max(1,sp.days|0),guard=0;
    while(n<days&&guard++<600){end=addD(end,1);if(isWork(end))n++}
    prevEnd=end;
    return {sp,start:st,end};
  });
}

/* ---------- timeline ---------- */
const tl=document.getElementById('tl');
const lum=h=>{const n=parseInt(h.slice(1),16);const r=n>>16&255,g=n>>8&255,b=n&255;return (0.299*r+0.587*g+0.114*b)/255};
function renderTimeline(){
  OFF=new Set(state.offDays);
  const dw=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dw'))||26;
  const W=N*dw;
  let h='';
  // background columns
  h+='<div class="cols" style="width:'+W+'px">';
  DAYS.forEach((d,i)=>{
    const we=d.getDay()===0||d.getDay()===6, off=OFF.has(iso(d)), ms=d.getDate()===1, td=iso(d)===iso(TODAY);
    const cls=[we?'we':'',off&&!we?'off':'',ms?'mstart':'',td?'today':''].filter(Boolean).join(' ');
    if(cls)h+='<div class="col '+cls+'" style="left:'+(i*dw)+'px;width:'+dw+'px"></div>';
  });
  h+='</div>';
  // months
  h+='<div class="row months"><div class="lab">Mes</div><div class="lane" style="width:'+W+'px;height:34px">';
  let i=0;while(i<N){const m=DAYS[i].getMonth();let j=i;while(j<N&&DAYS[j].getMonth()===m)j++;
    h+='<div class="month'+(m===8?' out':'')+'" style="left:'+(i*dw)+'px;width:'+((j-i)*dw)+'px">'+((j-i)*dw>110?MESL[m]:(j-i)*dw>34?MES[m].charAt(0).toUpperCase()+MES[m].slice(1):'')+'</div>';i=j}
  h+='</div></div>';
  // days
  h+='<div class="row days"><div class="lab">Día</div><div class="lane" style="width:'+W+'px;height:40px">';
  DAYS.forEach((d,i)=>{
    const we=d.getDay()===0||d.getDay()===6, off=OFF.has(iso(d));
    const cls=['day',we?'we':'',off?'off':'',iso(d)===iso(TODAY)?'today':''].join(' ');
    const lbl=fmt(d)+(we?' (fin de semana)':off?': día libre. Toca para volverlo hábil':': toca para marcarlo libre');
    h+='<button class="'+cls+'" data-day="'+iso(d)+'" '+(we?'tabindex="-1" disabled':'')+' title="'+lbl+'" aria-label="'+lbl+'" style="left:'+(i*dw)+'px;width:'+dw+'px">'+(dw>=20?'<span>'+DIA[d.getDay()]+'</span>':'')+'<b>'+d.getDate()+'</b></button>';
  });
  h+='</div></div>';
  if(!state.products.length){h+='<div class="empty-tl">Todavía no hay productos. Agrega el primero con “+ Producto”.</div>'}
  state.products.forEach(p=>{
    const sch=schedule(p);
    const lanes=[];const placed=[];
    sch.forEach(x=>{
      const a=idxOf(x.start),b=idxOf(x.end);
      let l=lanes.findIndex(e=>e<a);if(l<0){l=lanes.length;lanes.push(b)}else lanes[l]=b;
      placed.push({x,a,b,l});
    });
    const nl=Math.max(1,lanes.length),H=nl*34+12;
    const txt=lum(p.color)>0.62?'#15203A':'#FFFFFF';
    h+='<div class="row prow"><div class="lab"><span class="dot" style="background:'+esc(p.color)+'"></span><div>'+esc(p.name||'Sin nombre')+'<small>'+p.sprints.length+' sprint'+(p.sprints.length===1?'':'s')+'</small></div></div><div class="lane" style="width:'+W+'px;height:'+H+'px">';
    placed.forEach(({x,a,b,l})=>{
      if(b<0||a>N-1)return;
      const ca=Math.max(0,a),cb=Math.min(N-1,b);
      const done=x.sp.tasks.filter(t=>t.status==='listo').length,tot=x.sp.tasks.length;
      const lab=esc(x.sp.name||'Sprint')+' · '+fmt(x.start)+' – '+fmt(x.end)+' · '+x.sp.days+' días hábiles';
      h+='<button class="bar'+(b>N-1?' clip-r':'')+(a<0?' clip-l':'')+'" data-jump="'+x.sp.id+'" title="'+lab+'" aria-label="'+lab+'" style="left:'+(ca*dw+2)+'px;width:'+((cb-ca+1)*dw-4)+'px;top:'+(8+l*34)+'px;--bc:'+esc(p.color)+'"><span>'+esc(x.sp.name||'Sprint')+'</span>'+(tot?'<em>'+done+'/'+tot+'</em>':'<em>'+x.sp.days+'d</em>')+(tot?'<i class="prog" style="width:'+(done/tot*100)+'%"></i>':'')+'</button>';
    });
    h+='</div></div>';
  });
  tl.innerHTML=h;
}

/* ---------- panel ---------- */
const panel=document.getElementById('panel');
function computedHTML(x){
  const out=iso(x.end)>Q_END_ISO;
  return '<div class="computed'+(out?' warn':'')+'" id="c-'+x.sp.id+'">'+fmt(x.start)+' – '+fmt(x.end)+'<small>'+(out?'Termina después del 31 dic':'Termina el '+DIA_L[x.end.getDay()]+' '+fmt(x.end))+'</small></div>';
}
const DIA_L=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function taskCount(sp){const d=sp.tasks.filter(t=>t.status==='listo').length;return 'Tareas '+(sp.tasks.length?d+'/'+sp.tasks.length:'')+' '+(openTasks.has(sp.id)?'▴':'▾')}
function renderPanel(){
  if(!state.products.length){panel.innerHTML='<p class="muted">Agrega un producto para empezar a planificar sus sprints.</p>';return}
  panel.innerHTML=state.products.map(p=>{
    const sch=schedule(p);
    return '<section class="product'+(p.closed?' closed':'')+'" style="--pc:'+esc(p.color)+'" data-p="'+p.id+'">'+
      '<div class="phead"><button class="caret" data-a="toggleP" aria-label="Mostrar u ocultar sprints" aria-expanded="'+(!p.closed)+'">▾</button>'+
      '<input class="pname" data-f="pname" value="'+esc(p.name)+'" aria-label="Nombre del producto">'+
      '<input type="color" class="color" data-f="pcolor" value="'+esc(p.color)+'" aria-label="Color del producto">'+
      '<span class="pmeta">'+p.sprints.length+' sprint'+(p.sprints.length===1?'':'s')+'</span>'+
      '<button class="icon" data-a="delP" aria-label="Eliminar producto" title="Eliminar producto">✕</button></div>'+
      '<div class="sprints">'+sch.map((x,k)=>sprintHTML(p,x,k)).join('')+
      '<div class="addsprint pactions"><button class="btn" data-a="addS">+ Sprint</button><button class="btn" data-a="repeat" title="Agrega sprints encadenados con la misma duración y pausa hasta fin de año">Repetir hasta diciembre</button></div></div>'+
      '</section>';
  }).join('');
}
function sprintHTML(p,x,k){
  const sp=x.sp,open=openTasks.has(sp.id);
  const modeSel=k===0?'<select class="field" data-f="mode" disabled aria-label="Inicio"><option>En fecha</option></select>':
    '<select class="field" data-f="mode" aria-label="Cómo inicia"><option value="date"'+(sp.mode==='date'?' selected':'')+'>En fecha</option><option value="after"'+(sp.mode==='after'?' selected':'')+'>Después del anterior</option></select>';
  const startCtl=(k===0||sp.mode==='date')?'<input type="date" class="field" data-f="start" value="'+esc(sp.start)+'" min="2026-09-01" max="2027-01-31" aria-label="Fecha de inicio">':
    '<span class="gap">pausa <input type="number" min="0" max="60" class="field" data-f="gap" value="'+(sp.gap|0)+'" aria-label="Días hábiles de pausa"> días háb.</span>';
  return '<div class="sprint" data-s="'+sp.id+'" id="s-'+sp.id+'">'+
    '<div class="srow">'+
      '<input class="field" data-f="sname" value="'+esc(sp.name)+'" aria-label="Nombre del sprint">'+
      '<div class="start">'+modeSel+startCtl+'</div>'+
      '<div class="step"><button data-a="dec" aria-label="Un día menos">−</button><input type="number" min="1" max="120" data-f="days" value="'+sp.days+'" aria-label="Días hábiles"><span>días háb.</span><button data-a="inc" aria-label="Un día más">+</button></div>'+
      computedHTML(x)+
      '<div class="link"><input type="url" class="field" data-f="link" value="'+esc(sp.link||'')+'" placeholder="Link de ClickUp" aria-label="Link de ClickUp"><a target="_blank" rel="noopener" href="'+esc(safeUrl(sp.link))+'"'+(safeUrl(sp.link)?'':' hidden')+'>Abrir</a></div>'+
      '<button class="ttoggle" data-a="toggleT" aria-expanded="'+open+'" id="tc-'+sp.id+'">'+taskCount(sp)+'</button>'+
      '<button class="icon" data-a="delS" aria-label="Eliminar sprint" title="Eliminar sprint">✕</button>'+
    '</div>'+
    '<div class="tasks'+(open?' open':'')+'">'+
      (sp.tasks.length?sp.tasks.map(t=>'<div class="task'+(t.status==='listo'?' done':'')+'" data-t="'+t.id+'">'+
        '<select class="field" data-f="tstatus" aria-label="Estado"><option value="pendiente"'+(t.status==='pendiente'?' selected':'')+'>Pendiente</option><option value="en curso"'+(t.status==='en curso'?' selected':'')+'>En curso</option><option value="listo"'+(t.status==='listo'?' selected':'')+'>Listo</option></select>'+
        '<input class="field txt" data-f="ttext" value="'+esc(t.text)+'" aria-label="Tarea">'+
        '<button class="icon" data-a="delT" aria-label="Eliminar tarea">✕</button></div>').join(''):'<p class="muted">Sin tareas todavía. Escribe una y presiona Enter.</p>')+
      '<div class="addtask"><input class="field" data-f="newtask" placeholder="Nueva tarea" aria-label="Nueva tarea"><button class="btn" data-a="addT">Agregar</button></div>'+
    '</div></div>';
}
function safeUrl(u){u=(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);return /^https?:$/.test(x.protocol)&&x.hostname.includes('.')?x.href:''}catch(e){return ''}}
function updateComputed(){
  state.products.forEach(p=>schedule(p).forEach(x=>{
    const el=document.getElementById('c-'+x.sp.id);if(el)el.outerHTML=computedHTML(x);
  }));
}
const renderAll=()=>{renderTimeline();renderPanel()};

/* ---------- lookup ---------- */
const P=id=>state.products.find(p=>p.id===id);
function ctx(el){
  const pe=el.closest('[data-p]'),se=el.closest('[data-s]'),te=el.closest('[data-t]');
  const p=pe&&P(pe.dataset.p);const sp=p&&se&&p.sprints.find(s=>s.id===se.dataset.s);
  const t=sp&&te&&sp.tasks.find(x=>x.id===te.dataset.t);return {p,sp,t,se};
}

/* ---------- undo ---------- */
let undoSnap=null,toastT;
function snapshot(msg){
  undoSnap=JSON.stringify(state);
  document.getElementById('toastMsg').textContent=msg;
  const t=document.getElementById('toast');t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),6000);
}
document.getElementById('undo').onclick=()=>{if(!undoSnap)return;state=JSON.parse(undoSnap);undoSnap=null;document.getElementById('toast').classList.remove('show');renderAll();persist()};

/* ---------- events ---------- */
panel.addEventListener('input',e=>{
  const f=e.target.dataset.f;if(!f||f==='newtask')return;
  const {p,sp,t}=ctx(e.target);if(!p)return;
  const v=e.target.value;
  if(f==='pname')p.name=v;
  else if(f==='pcolor'){p.color=v;e.target.closest('.product').style.setProperty('--pc',v)}
  else if(f==='sname')sp.name=v;
  else if(f==='start'){if(!v)return;sp.start=v}
  else if(f==='gap')sp.gap=Math.max(0,Math.min(60,parseInt(v)||0));
  else if(f==='days'){const n=parseInt(v);if(!n||n<1)return;sp.days=Math.min(120,n)}
  else if(f==='ttext')t.text=v;
  else if(f==='link'){sp.link=v;const a=e.target.parentElement.querySelector('a');const u=safeUrl(v);a.href=u||'#';a.hidden=!u;persist();return}
  else return;
  renderTimeline();updateComputed();persist();
});
panel.addEventListener('change',e=>{
  const f=e.target.dataset.f;const {p,sp,t}=ctx(e.target);if(!p)return;
  if(f==='mode'){sp.mode=e.target.value;if(sp.mode==='date'){const sch=schedule(p).find(x=>x.sp===sp);sp.start=iso(sch.start)}renderAll();persist()}
  else if(f==='tstatus'){t.status=e.target.value;renderAll();persist()}
  else if(f==='pname'||f==='sname')renderPanel();
});
panel.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.f==='newtask'){e.preventDefault();addTask(e.target)}});
function addTask(input){
  const {sp,se}=ctx(input);const v=input.value.trim();if(!v)return;
  sp.tasks.push({id:uid(),text:v,status:'pendiente'});openTasks.add(sp.id);
  renderAll();persist();
  const ni=document.querySelector('#s-'+sp.id+' [data-f="newtask"]');if(ni)ni.focus();
}
panel.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;const {p,sp,t}=ctx(b);if(!p)return;
  if(a==='toggleP'){p.closed=!p.closed;renderPanel();persist()}
  else if(a==='delP'){snapshot('Producto “'+(p.name||'Sin nombre')+'” eliminado.');state.products=state.products.filter(x=>x!==p);renderAll();persist()}
  else if(a==='addS'){
    const last=p.sprints[p.sprints.length-1];
    const n={id:uid(),name:'Sprint '+(p.sprints.length+1),mode:last?'after':'date',start:last?last.start:iso(TODAY),gap:last?(last.mode==='after'?last.gap:0):0,days:last?last.days:10,tasks:[]};
    p.sprints.push(n);p.closed=false;renderAll();persist();
  }
  else if(a==='repeat'){
    if(!p.sprints.length)return;
    let guard=0;
    while(guard++<30){
      const sch=schedule(p);const lastX=sch[sch.length-1];const last=lastX.sp;
      const gap=last.mode==='after'?last.gap:0;
      const cand={id:uid(),name:'Sprint '+(p.sprints.length+1),mode:'after',start:last.start,gap,days:last.days,tasks:[]};
      p.sprints.push(cand);
      const s2=schedule(p);if(iso(s2[s2.length-1].start)>Q_END_ISO){p.sprints.pop();break}
    }
    renderAll();persist();
  }
  else if(a==='inc'||a==='dec'){sp.days=Math.max(1,Math.min(120,sp.days+(a==='inc'?1:-1)));b.parentElement.querySelector('input').value=sp.days;renderTimeline();updateComputed();persist()}
  else if(a==='toggleT'){openTasks.has(sp.id)?openTasks.delete(sp.id):openTasks.add(sp.id);
    const box=document.querySelector('#s-'+sp.id+' .tasks');box.classList.toggle('open');b.setAttribute('aria-expanded',openTasks.has(sp.id));b.textContent=taskCount(sp);
    if(openTasks.has(sp.id))box.querySelector('[data-f="newtask"]').focus()}
  else if(a==='delS'){snapshot('Sprint eliminado.');p.sprints=p.sprints.filter(x=>x!==sp);if(p.sprints[0])p.sprints[0].mode='date';renderAll();persist()}
  else if(a==='addT')addTask(b.parentElement.querySelector('input'));
  else if(a==='delT'){snapshot('Tarea eliminada.');sp.tasks=sp.tasks.filter(x=>x!==t);renderAll();persist()}
});
tl.addEventListener('click',e=>{
  const d=e.target.closest('[data-day]');
  if(d){const k=d.dataset.day;const s=new Set(state.offDays);s.has(k)?s.delete(k):s.add(k);state.offDays=[...s].sort();renderAll();persist();return}
  const j=e.target.closest('[data-jump]');
  if(j){const id=j.dataset.jump;const p=state.products.find(p=>p.sprints.some(s=>s.id===id));
    if(p&&p.closed){p.closed=false;renderPanel()}
    openTasks.add(id);const el=document.getElementById('s-'+id);
    if(el){el.querySelector('.tasks').classList.add('open');const tb=document.getElementById('tc-'+id);const sp=p.sprints.find(s=>s.id===id);tb.setAttribute('aria-expanded','true');tb.textContent=taskCount(sp);
      el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});
      el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}
});
document.getElementById('addProduct').onclick=()=>{
  const color=PALETTE[state.products.length%PALETTE.length];
  const p={id:uid(),name:'Nuevo producto',color,closed:false,sprints:[{id:uid(),name:'Sprint 1',mode:'date',start:iso(TODAY<TL_START?TL_START:TODAY),gap:0,days:10,tasks:[]}]};
  state.products.push(p);renderAll();persist();
  const inp=document.querySelector('[data-p="'+p.id+'"] .pname');if(inp){inp.scrollIntoView({block:'center'});inp.select()}
};
const setDw=delta=>{const r=document.documentElement;const cur=parseFloat(getComputedStyle(r).getPropertyValue('--dw'))||26;const n=Math.max(12,Math.min(44,cur+delta));r.style.setProperty('--dw',n+'px');try{localStorage.setItem(KEY+'-dw',n)}catch(e){}renderTimeline()};
document.getElementById('zin').onclick=()=>setDw(4);
document.getElementById('zout').onclick=()=>setDw(-4);
try{const z=localStorage.getItem(KEY+'-dw');if(z)document.documentElement.style.setProperty('--dw',z+'px')}catch(e){}

/* ---------- persistence ---------- */
const statusEl=document.getElementById('status');
/* ---------- persistencia: navegador + Supabase ---------- */
const CFG=window.ROADMAP_CONFIG||{};
const CLIENT_ID=uid()+uid();
let sb=null,saveTimer=null,saving=false,pending=false,remotePending=null;
const configured=CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&!/TU-PROYECTO|TU_ANON_KEY/.test(CFG.SUPABASE_URL+CFG.SUPABASE_ANON_KEY)&&window.supabase;
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  if(!sb){statusEl.textContent='Guardado en este navegador';return}
  statusEl.textContent='Guardando…';clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(!sb)return;if(saving){pending=true;return}
  saving=true;
  const {error}=await sb.from('roadmaps').upsert({id:CFG.ROADMAP_ID,data:state,client_id:CLIENT_ID,updated_at:new Date().toISOString()});
  statusEl.textContent=error?'Sin conexión: guardado en este navegador':'Guardado en la nube';
  if(error)console.error(error);
  saving=false;if(pending){pending=false;flush()}
}
const editing=()=>{const a=document.activeElement;return a&&panel.contains(a)&&/INPUT|SELECT/.test(a.tagName)};
function applyRemote(data){
  if(!data||!Array.isArray(data.products))return;
  if(editing()){remotePending=data;return}
  state=data;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  renderAll();statusEl.textContent='Actualizado';
}
panel.addEventListener('focusout',()=>setTimeout(()=>{if(remotePending&&!editing()){const d=remotePending;remotePending=null;applyRemote(d)}},50));
renderAll();
if(!configured){statusEl.textContent='Guardado en este navegador'}
else{
  statusEl.textContent='Conectando…';
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  (async()=>{
    const {data,error}=await sb.from('roadmaps').select('data').eq('id',CFG.ROADMAP_ID).maybeSingle();
    if(error){console.error(error);statusEl.textContent='Sin conexión: guardado en este navegador';return}
    if(data&&data.data&&Array.isArray(data.data.products)){applyRemote(data.data);statusEl.textContent='Guardado en la nube'}
    else flush();
    sb.channel('roadmap-'+CFG.ROADMAP_ID)
      .on('postgres_changes',{event:'*',schema:'public',table:'roadmaps',filter:'id=eq.'+CFG.ROADMAP_ID},payload=>{
        const row=payload.new;if(!row||row.client_id===CLIENT_ID)return;
        applyRemote(row.data);
      }).subscribe();
  })();
}
})();
</script>
</body>
